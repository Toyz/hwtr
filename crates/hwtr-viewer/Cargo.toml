[package]
name = "hwtr-viewer"
version = "0.1.0"
description = "A viewer for the disc's content: fly around any track as the game draws it, with its textures looked up through VRAM the way the PlayStation does."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
hwtr-data.workspace = true
rrt = { workspace = true, features = ["app", "disc"] }
hwtr-render.workspace = true
