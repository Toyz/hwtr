[index]
header = """
# Worklog

Running engineering log for reverse engineering Hot Wheels Turbo Racing
(PlayStation, SLUS-00964) and porting it to the PC. One file per entry under
[`worklog/`](worklog/), newest at the bottom. This index is generated by
`cairns index` - edit the entries, not this file.

Code says what; the worklog says *how we found out* and *why it is that way*.
The [reference](docs/README.md) says what is true now.
"""

[[area]]
name  = "disc"
about = "the CD image, its tracks, the ISO 9660 file system, SYSTEM.CNF and boot"
[[area]]
name  = "format"
about = "a container or record layout decoded"
[[area]]
name  = "decomp"
about = "facts pulled out of the executable or its overlays"
[[area]]
name  = "engine"
about = "game loop, tasks, memory, overlay and file loading"
[[area]]
name  = "render"
about = "GPU and GTE pipeline, models, textures, the track renderer"
[[area]]
name  = "physics"
about = "car handling, collision, stunts, the track as the car sees it"
[[area]]
name  = "race"
about = "race rules, opponents and their driving, modes, unlocks"
[[area]]
name  = "audio"
about = "SPU, sound effects, VAB banks, CD-DA music, XA"
[[area]]
name  = "video"
about = "STR movies and the MDEC"
[[area]]
name  = "ui"
about = "menus, HUD, fonts, text"
[[area]]
name  = "input"
about = "the pad, the analog stick, vibration, the PC controller mapping"
[[area]]
name  = "save"
about = "memory card data"
[[area]]
name  = "content"
about = "what is on the disc, inventories, counts"
[[area]]
name  = "design"
about = "a decision made, with the alternatives rejected"
[[area]]
name  = "bug"
about = "a fault diagnosed, with the root cause"
[[area]]
name  = "tooling"
about = "the extractors, disassemblers and viewers in hwtr-re"
[[area]]
name  = "build"
about = "repository layout and how things are run"
[[area]]
name  = "test"
about = "harnesses and fixtures"
