about = "facts pulled out of the executable or its overlays"
[[area]]
name  = "engine"
about = "game loop, tasks, memory, overlay and file loading"
[[area]]
name  = "render"
about = "GPU and GTE pipeline, models, textures, the track renderer"
[[area]]
name  = "physics"
about = "car handling, collision, stunts, the track as the car sees it"
[[area]]
name  = "race"
about = "race rules, opponents and their driving, modes, unlocks"
[[area]]
name  = "audio"
about = "SPU, sound effects, VAB banks, CD-DA music, XA"
[[area]]
name  = "video"
about = "STR movies and the MDEC"
[[area]]
name  = "ui"
about = "menus, HUD, fonts, text"
[[area]]
name  = "input"
